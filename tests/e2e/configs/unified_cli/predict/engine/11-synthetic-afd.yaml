traffic:
  source:
    type: synthetic
    input_tokens: 8
    output_tokens: 3
  load:
    type: concurrency
    concurrency: 2
  stop:
    requests: 4
engine:
  mode: aggregated
  model: tests/e2e/configs/unified_cli/fixtures/tiny-model
  hardware: h200_sxm
  backend: sglang
  context_length: 2048
  workers:
    aggregated:
      type: afd
      afd:
        n_a_nodes: 1
        n_f_nodes: 1
        tp_a: 1
        a_batch_size: 8
        num_microbatches: 3
